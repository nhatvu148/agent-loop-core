[package]
name = "agent-loop-core"
# Own version line, deliberately not `version.workspace` (= vexar's 0.19.0):
# this is a new public crate and its semver starts from scratch at 0.1.0.
version = "0.1.0"
description = "A hand-rolled LLM agent loop: resilient chat transport, typed tools with derived schemas, a streaming event sink, and a two-model cost split. Provider-agnostic over any OpenAI-compatible endpoint."
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "tool-calling", "openai", "ai"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
schemars = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
