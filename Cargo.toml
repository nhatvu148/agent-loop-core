[package]
name = "agent-loop-core"
version = "0.1.0"
description = "A hand-rolled LLM agent loop: resilient chat transport, typed tools with derived schemas, a streaming event sink, and a two-model cost split. Provider-agnostic over any OpenAI-compatible endpoint."
edition = "2024"
rust-version = "1.88.0"
authors = ["Vexar Team"]
license = "MIT"
repository = "https://github.com/nhatvu148/agent-loop-core"
readme = "README.md"
keywords = ["agent", "llm", "tool-calling", "openai", "ai"]
categories = ["asynchronous", "api-bindings"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
async-trait = "0.1"
schemars = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
